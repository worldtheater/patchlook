[package]
name = "patchlook"
version = "0.1.5"
edition = "2024"
rust-version = "1.95"
description = "A local Git diff and history viewer for macOS, Windows and Linux"
repository = "https://github.com/worldtheater/patchlook"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
directories = "6"
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSFileManager", "NSGeometry", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.21"
freedesktop-icons = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
png = "0.18"

[build-dependencies]
embed-resource = "3.0"

[patch.crates-io]
gpui-kit = { git = "https://github.com/worldtheater/gpui-kit.git", rev = "0917a5564505fceacfbbf966d90c0c19a7af9820" }

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.release]
lto = "thin"
strip = true
