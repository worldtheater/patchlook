name: Homepage

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'locales/**'
      - 'docs/images/patchlook-light-dark.webp'
      - 'assets/app-icon/patchlook-v2.png'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'locales/**'
      - 'docs/images/patchlook-light-dark.webp'
      - 'assets/app-icon/patchlook-v2.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check homepage build and release links
        run: python -m unittest discover -s website -p 'test_*.py'
      - name: Read latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
      - name: Build static homepage
        run: python website/build.py --release-json "$RUNNER_TEMP/release.json"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
