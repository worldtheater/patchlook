name: Desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      notary_submission_id:
        description: 'Query an existing Apple notarization submission instead of building'
        required: false
        type: string

permissions:
  contents: read

jobs:
  notary-status:
    if: github.event_name == 'workflow_dispatch' && inputs.notary_submission_id != ''
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Query Apple notarization status
        env:
          SUBMISSION_ID: ${{ inputs.notary_submission_id }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import os, uuid; uuid.UUID(os.environ["SUBMISSION_ID"])'
          xcrun notarytool info "$SUBMISSION_ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --output-format json > "$RUNNER_TEMP/notary-info.json"
          cat "$RUNNER_TEMP/notary-info.json"
          {
            printf '### Apple notarization status\n\n```json\n'
            cat "$RUNNER_TEMP/notary-info.json"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary-info.json")"
          if [[ "$STATUS" != 'In Progress' ]]; then
            xcrun notarytool log "$SUBMISSION_ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          fi

  build:
    if: inputs.notary_submission_id == ''
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match Cargo.toml version'
          PY
      - name: Import macOS release credentials
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          SIGNING_KEYCHAIN_PATH="$RUNNER_TEMP/patchlook-signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/patchlook-certificate.p12"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/patchlook-certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12 -k "$SIGNING_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN_PATH"
          xcrun notarytool store-credentials patchlook-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$SIGNING_KEYCHAIN_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang cmake pkg-config libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 libglib2.0-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # UI tests change process-global locale; keep their interactions isolated.
      - run: cargo test --locked -- --test-threads=1
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --locked --release
      - name: Package signed and notarized macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: python scripts/package.py --sign-identity "$MACOS_SIGNING_IDENTITY" --notary-profile patchlook-notary --notary-keychain "$RUNNER_TEMP/patchlook-signing.keychain-db"
      - name: Package development or other platform build
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v')
        run: python scripts/package.py
      - name: Remove macOS release credentials
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/patchlook-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/patchlook-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/patchlook-certificate.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: patchlook-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: patchlook-*
          merge-multiple: true
          path: dist
      - name: Create or update release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if [[ "$(jq -r .isDraft release.json)" != true ]]; then
              echo '::error::Refusing to replace assets of a published release'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Patchlook $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
